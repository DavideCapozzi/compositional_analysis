# ==============================================================================
# PROJECT CONFIGURATION: CLR Network Inference
# ==============================================================================

# --- Setup ---
output_root: "results"
# Output root is "{output_root}_{project_name}" and a re-run OVERWRITES it in place.
# results_longsurvivors/ is the frozen 2026-06 reference that diagnostics/ scripts read by
# hardcoded path -- do NOT point project_name back at it. Nothing under results*/ is in git.
#   "longsurvivors_qcfix" = 3 cohorts under the 2026-07-29 per-panel QC (161 samples)
#   "gbm"                 = the 4-cohort run; switch when the GBM sheet lands (see below)
project_name: "longsurvivors_qcfix"
input_file: "data/DB_standardizzatov5_intermedi.xlsx"

transformation:
  method: "logit" # Options: "logit" (for FACS percentages/proportions), "none" (for continuous unbounded data)
input_format: "percentage"  # Options: "percentage" (0-100) or "proportion" (0-1). Applied only if method is "logit".

# --- ANALYSIS TARGETS ---
# Define here exactly which groups form the analysis.
# Names must match the values in the 'stratification.column' (DATA$metadata$Original_Source).
control_group: "Healthy_Donors"
case_groups: ["HNSCC_EP", "NSCLC_EP", "HNSCC_INT", "NSCLC_INT", "NSCLC_LS", "HNSCC_LS"] 

# --- ANALYSIS SCENARIOS (Config-Driven Orchestration) ---
# Each item here triggers a full analysis cycle (Hypothesis -> Multivariate -> Network)
analysis_scenarios:
  - id: "00_HDvsTumor"
    description: "Global comparison of Healthy Donors against all cancer patients (EP + LS)"
    case_label: "Tumor"
    case_groups: ["HNSCC_EP", "NSCLC_EP", "HNSCC_LS", "NSCLC_LS"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]

  - id: "01_HDvsEP"
    description: "Characterizing the disease signature"
    case_label: "EP"
    case_groups: ["HNSCC_EP", "NSCLC_EP"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]
    
  - id: "02_HDvsLS"
    description: "Checking if Long Survivors return to healthy phenotype"
    case_label: "LS"
    case_groups: ["HNSCC_LS", "NSCLC_LS"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]
    
  - id: "03_EPvsLS"
    description: "Identifying resistance features (Long survivors vs Early Progressors)"
    case_label: "LS"
    case_groups: ["HNSCC_LS", "NSCLC_LS"]
    control_label: "EP"
    control_groups: ["HNSCC_EP", "NSCLC_EP"]

  - id: "04_HDvsINT"
    description: "Defining typical patient inter-tumor signature"
    case_label: "INT"
    case_groups: ["HNSCC_INT", "NSCLC_INT"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]

  - id: "05_EPvsINT"
    description: "Identifying other EP features"
    case_label: "INT"
    case_groups: ["HNSCC_INT", "NSCLC_INT"]
    control_label: "EP"
    control_groups: ["HNSCC_EP", "NSCLC_EP"]

  - id: "06_INTvsLS"
    description: "Identifying other LS features"
    case_label: "LS"
    case_groups: ["HNSCC_LS", "NSCLC_LS"]
    control_label: "INT"
    control_groups: ["HNSCC_INT", "NSCLC_INT"]

# =============================================================================
# GBM ACTIVATION — apply all of this together when the GBM sheet lands.
# Colours (above) and the cohorts entry are already staged.
#
# 1. Uncomment  GBM: "GBM"  under `cohorts:`.
# 2. Append to `case_groups:`  ->  "GBM_EP", "GBM_INT", "GBM_LS"
# 3. Add GBM_* into the pan-tumor scenarios above:
#      00_HDvsTumor  case    += GBM_EP, GBM_LS      (pattern is EP+LS only)
#      01_HDvsEP     case    += GBM_EP
#      02_HDvsLS     case    += GBM_LS
#      03_EPvsLS     case    += GBM_LS   control += GBM_EP
#      04_HDvsINT    case    += GBM_INT
#      05_EPvsINT    case    += GBM_INT  control += GBM_EP
#      06_INTvsLS    case    += GBM_LS   control += GBM_INT
# 4. Uncomment scenario 07 below (unique case_label -> GBM gets its own baseline).
# 5. Set  project_name: "gbm"  and  trustworthy.quick: true  for the first run.
# 6. Add "07_HDvsGBM" to trustworthy.tasks.
#
# CONSEQUENCE, state it in the methods: step 04 keys baselines by case_label, so
# steps 3 above change the EP/INT/LS/Tumor baselines used by EVERY scenario sharing
# those labels. No existing scenario stays comparable to a pre-GBM run. That is the
# intended behaviour of pan-tumor inclusion, not a bug.
#
# GBM stages will be n~6-7, below stats.min_network_n (8), so GBM_EP/INT/LS get no
# standalone baselines -- only the pooled groups and 07_HDvsGBM (n~20). Expected.
#
# Given naive-T was retired when a pooled p=0.001 became NSCLC-only p=1.000, every
# pooled GBM-inclusive finding needs the within-disease check before it is claimed.
# =============================================================================
#  - id: "07_HDvsGBM"
#    description: "GBM cohort against healthy donors - the only adequately powered GBM contrast"
#    case_label: "GBM"
#    case_groups: ["GBM_EP", "GBM_INT", "GBM_LS"]
#    control_label: "HD"
#    control_groups: ["Healthy_Donors"]

# --- STRATIFICATION LOGIC ---
stratification:
  column: "Original_Source"     # Metadata column containing the precise group names

# --- COHORTS MAPPING ---
# key = macro Group label, value = Excel sheet name.
cohorts:
  NSCLC: "NSCLC"
  HNSCC: "HNSCC"
  Healthy_Donors: "HD"
  # GBM: "GBM"        # <-- uncomment when the GBM sheet exists (see GBM ACTIVATION below)

marker_selection:
  whitelist: []      
  blacklist: [] 

sample_selection:
  #blacklist: ["DS51.fcs"]
  blacklist: ["HD51", "HNSCC21"]  

metadata:
  subgroup_col: "Original_Source"

# --- Quality Control ---
qc:
  max_na_row_pct: 0.45   # computed over each patient's OWN cohort panel (sporadic NAs only)
  max_na_col_pct: 0.20
  remove_outliers: true
  outlier_conf_level: 0.99
  # Drop markers that are not present in EVERY cohort's assay panel. Without this, a marker
  # measured by 3 of 4 cohorts stays under max_na_col_pct and gets BPCA-imputed, fabricating
  # values for a cohort that never ran the stain.
  require_marker_in_all_panels: true

# QC Reporting Configuration
qc_reporting:
  marker_categories:
    CD3_Lineage:
      - "CD3"
      - "CD3CM"
      - "CD3EFF"
      - "CD3EM"
      - "CD3NAIVE"
      - "CD3KI67"
      - "CD3KI67CM"
      - "CD3KI67EFF"
      - "CD3KI657EMRA"
      - "CD3KI67NAIVE"
    CD3_PD1_Complex: 
      - "CD3PD1"
      - "CD3PD1KI67"
      - "CD3PD1CM"
      - "CD3PD1EFF"
      - "CD3PD1EMRA"
      - "CD3PD1NAIVE"
    CD3_CD28_Complex:
      - "CD3CD28"
      - "CD3CD28KI67"
      - "CD3CD28CM"
      - "CD3CD28EFF"
      - "CD3CD28EMRA"
      - "CD3CD28NAIVE"
    CD3_CD137_Complex:
      - "CD3CD137"
      - "CD3CD137KI67"
      - "CD3CD137PD1"
      - "CD3CD137CM"
      - "CD3CD137EFF"
      - "CD3CD137EMRA"
      - "CD3CD137NAIVE"
    CD8_Lineage:
      - "CD8"
      - "CD8CD28"
      - "CD8CD137"
      - "CD8KI67"
      - "CD8PD1"
    CD4_Lineage:
      - "CD4"
      - "CD4CD28"
      - "CD4CD137"
      - "CD4KI67"
      - "CD4PD1"
    Tregs:
      - "TREG_TOTAL"
      - "TREG_RESTING"
      - "TREG_ACTIVE"
      - "TREG_NON-SUPPRESSIVE"
      - "TREGCD137"
    Myeloid_MDSC:
      - "M-MDSC"
      - "LOX1-PMN-MDSC"

# --- Imputation (CoDa) ---
imputation:   
  epsilon: "auto"

# --- Multivariate & Interpretation ---
multivariate:
  run_plsda: true
  n_comp: 2           
  validation_folds: 5 
  n_repeat_cv: 50
  top_n_loadings: 15  
  
# --- VISUALS & COLORS ---
colors:
  # Palette for generic case mapping if specific names are not found below
  control: "#2E8B57"        
  cases: ["#CD5C5C", "#4682B4", "#9932CC", "#FF8C00"] 

  # Specific color mapping for precise group names found in Original_Source
  groups:
    # Single groups
    NSCLC: "#CD5C5C"         
    HNSCC: "#4682B4"         
    Healthy_Donors: "#2E8B57" 
    
    # Multi-layer analyses
    HD: "#2E8B57"   
    EP: "#CD5C5C"  
    LS: "#FFD700"   
    Tumor: "#8B0000"

    INT: "#FFA500"
    NSCLC_INT: "#FF8C00"
    HNSCC_INT: "#FFB84D"

    # GBM (purple family, deliberately far from NSCLC red / HNSCC blue / INT orange).
    # Safe to define before the data exists: unused keys are simply never looked up.
    # Without these, GBM falls back to a cycled generic case colour that can collide
    # with NSCLC -- get_palette() now warns when that happens.
    GBM: "#7B3FA0"
    GBM_EP: "#9932CC"
    GBM_INT: "#B565D8"
    GBM_LS: "#5D2E7A"

  highlight: "#FFD700"

viz:
  heatmap_metadata: ["Group", "Original_Source"]
  highlight_pattern: "_LS"   # NB: outranks parent-group colour, so ALL *_LS render identical

# --- Inference Statistics ---
stats:
  seed: 2025
  min_sample_size: 4
  # Minimum group size for building a baseline network. corpcor::pcor.shrink returns a
  # plausible near-identity matrix at n=3 and the bootstrap CIs almost never cross zero,
  # so a tiny group yields a confident-looking network that is pure noise.
  min_network_n: 8
  min_variance: 0.000001
  n_boot: 1000
  n_perm: 2000
  pvalue_threshold: 0.05
  network_threshold_type: "absolute"
  network_edge_threshold: 0.075
  min_marginal_cor: 0.10
  n_cores: "auto"

# --- CYTOSCAPE EXPORT FILTERS ---
cytoscape_export:
  baseline:
    min_stability_freq: 0.95 
    min_abs_pcor: 0.10
    max_export_edges: 50 
  
  differential:
    exclude_conserved: false
    min_stability_freq_any: 0.95
    min_diff_score: 0.10
    max_export_edges: 50

# --- TRUSTWORTHY / ROBUSTNESS AUDIT MODULE (Phase 6) ---
# Spine = specification-curve robustness (P1); supports = conformal abstention
# (P2) + explanation-agreement audit (P3). P4/P5/P6 report PENDING behind a
# clinical-metadata gate; they have no implementation yet.
# NB: this is a robustness check, not a narrative -- the "trustworthy AI" framing
# was retired 2026-07-24. It is what turned EP-vs-LS from "we found nothing" into
# "nothing is there across 60 analytic choices".
trustworthy:
  enabled: true
  quick: false           # true = fast iteration grid; false = full grid (heavier)
  tasks: ["00_HDvsTumor", "03_EPvsLS"]   # explicit list -- new scenarios are NOT audited unless added here
  multiverse:
    representation: ["z", "raw_med", "raw_z"]
    feature_space:  ["abundance", "with_edges", "edges_only"]
    edge_threshold: [0.0, 0.10]
    estimator:      ["ridge", "enet", "lasso", "rf"]
    n_rep_quick: 6       # CV repeats per spec in quick mode
    n_rep_full: 15       # CV repeats per spec in full mode
    k: 5                 # CV folds
    n_perm: 200          # permutation draws for the headline null
  conformal:
    alpha: 0.10          # target miscoverage -> ~90% coverage
    n_rep: 150
  explanation:
    top_k: 10            # sources are fixed in src/06_trustworthy_ai.R (enet, rf_perm, splsda, net_degree)
  # --- DATA-GATED pillars: detected by tw_detect_clinical_meta(), reported as PENDING.
  # No implementation exists yet -- supplying the columns unlocks detection only.
  survival:
    enabled: true
    time_col: null       # e.g. "OS_time"
    event_col: null      # e.g. "OS_event"
  confound:
    enabled: true
    batch_col: null      # e.g. "Batch" / "Acquisition_Date" -- the single highest-value metadata addition
  fairness:
    enabled: true
