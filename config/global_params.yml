# ==============================================================================
# PROJECT CONFIGURATION: CLR Network Inference
# ==============================================================================

# --- Setup ---
output_root: "results"
project_name: "longsurvivors"
input_file: "data/DB_standardizzatov5_intermedi.xlsx"

transformation:
  method: "logit" # Options: "logit" (for FACS percentages/proportions), "none" (for continuous unbounded data)
input_format: "percentage"  # Options: "percentage" (0-100) or "proportion" (0-1). Applied only if method is "logit".

# --- ANALYSIS TARGETS ---
# Define here exactly which groups form the analysis.
# Names must match the values in the 'stratification.column' (DATA$metadata$Original_Source).
control_group: "Healthy_Donors"
case_groups: ["HNSCC_EP", "NSCLC_EP", "HNSCC_INT", "NSCLC_INT", "NSCLC_LS", "HNSCC_LS"] 

# --- ANALYSIS SCENARIOS (Config-Driven Orchestration) ---
# Each item here triggers a full analysis cycle (Hypothesis -> Multivariate -> Network)
analysis_scenarios:
  - id: "00_HDvsTumor"
    description: "Global comparison of Healthy Donors against all cancer patients (EP + LS)"
    case_label: "Tumor"
    case_groups: ["HNSCC_EP", "NSCLC_EP", "HNSCC_LS", "NSCLC_LS"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]

  - id: "01_HDvsEP"
    description: "Characterizing the disease signature"
    case_label: "EP"
    case_groups: ["HNSCC_EP", "NSCLC_EP"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]
    
  - id: "02_HDvsLS"
    description: "Checking if Long Survivors return to healthy phenotype"
    case_label: "LS"
    case_groups: ["HNSCC_LS", "NSCLC_LS"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]
    
  - id: "03_EPvsLS"
    description: "Identifying resistance features (Long survivors vs Early Progressors)"
    case_label: "LS"
    case_groups: ["HNSCC_LS", "NSCLC_LS"]
    control_label: "EP"
    control_groups: ["HNSCC_EP", "NSCLC_EP"]

  - id: "04_HDvsINT"
    description: "Defining typical patient inter-tumor signature"
    case_label: "INT"
    case_groups: ["HNSCC_INT", "NSCLC_INT"]
    control_label: "HD"
    control_groups: ["Healthy_Donors"]

  - id: "05_EPvsINT"
    description: "Identifying other EP features"
    case_label: "INT"
    case_groups: ["HNSCC_INT", "NSCLC_INT"]
    control_label: "EP"
    control_groups: ["HNSCC_EP", "NSCLC_EP"]

  - id: "06_INTvsLS"
    description: "Identifying other LS features"
    case_label: "LS"
    case_groups: ["HNSCC_LS", "NSCLC_LS"]
    control_label: "INT"
    control_groups: ["HNSCC_INT", "NSCLC_INT"]

# --- STRATIFICATION LOGIC ---
# "selection" mode simply promotes the target column to be the main grouping variable.
stratification:
  mode: "selection"             # Mode: direct selection from metadata
  column: "Original_Source"     # Metadata column containing the precise group names

# --- COHORTS MAPPING ---
cohorts:
  NSCLC: "NSCLC"
  HNSCC: "HNSCC"
  Healthy_Donors: "HD"

marker_selection:
  whitelist: []      
  blacklist: [] 

sample_selection:
  #blacklist: ["DS51.fcs"]
  blacklist: ["HD51", "HNSCC21"]  

hybrid_groups:
  Differentiation: []
  Lineage: []  
  Treg_Status: []
  
metadata:
  subgroup_col: "Original_Source"

# --- Quality Control ---
qc:
  max_na_row_pct: 0.45   
  max_na_col_pct: 0.20  
  remove_outliers: true
  outlier_conf_level: 0.99

# QC Reporting Configuration
qc_reporting:
  marker_categories:
    CD3_Lineage:
      - "CD3"
      - "CD3CM"
      - "CD3EFF"
      - "CD3EM"
      - "CD3NAIVE"
      - "CD3KI67"
      - "CD3KI67CM"
      - "CD3KI67EFF"
      - "CD3KI657EMRA"
      - "CD3KI67NAIVE"
    CD3_PD1_Complex: 
      - "CD3PD1"
      - "CD3PD1KI67"
      - "CD3PD1CM"
      - "CD3PD1EFF"
      - "CD3PD1EMRA"
      - "CD3PD1NAIVE"
    CD3_CD28_Complex:
      - "CD3CD28"
      - "CD3CD28KI67"
      - "CD3CD28CM"
      - "CD3CD28EFF"
      - "CD3CD28EMRA"
      - "CD3CD28NAIVE"
    CD3_CD137_Complex:
      - "CD3CD137"
      - "CD3CD137KI67"
      - "CD3CD137PD1"
      - "CD3CD137CM"
      - "CD3CD137EFF"
      - "CD3CD137EMRA"
      - "CD3CD137NAIVE"
    CD8_Lineage:
      - "CD8"
      - "CD8CD28"
      - "CD8CD137"
      - "CD8KI67"
      - "CD8PD1"
    CD4_Lineage:
      - "CD4"
      - "CD4CD28"
      - "CD4CD137"
      - "CD4KI67"
      - "CD4PD1"
    Tregs:
      - "TREG_TOTAL"
      - "TREG_RESTING"
      - "TREG_ACTIVE"
      - "TREG_NON-SUPPRESSIVE"
      - "TREGCD137"
    Myeloid_MDSC:
      - "M-MDSC"
      - "LOX1-PMN-MDSC"

# --- Imputation (CoDa) ---
imputation:   
  epsilon: "auto"

# --- Multivariate & Interpretation ---
multivariate:
  run_plsda: true
  n_comp: 2           
  validation_folds: 5 
  n_repeat_cv: 50
  top_n_loadings: 15  
  
# --- VISUALS & COLORS ---
colors:
  # Palette for generic case mapping if specific names are not found below
  control: "#2E8B57"        
  cases: ["#CD5C5C", "#4682B4", "#9932CC", "#FF8C00"] 

  # Specific color mapping for precise group names found in Original_Source
  groups:
    # Single groups
    NSCLC: "#CD5C5C"         
    HNSCC: "#4682B4"         
    Healthy_Donors: "#2E8B57" 
    
    # Multi-layer analyses
    HD: "#2E8B57"   
    EP: "#CD5C5C"  
    LS: "#FFD700"   
    Tumor: "#8B0000"

    INT: "#FFA500" 
    NSCLC_INT: "#FF8C00" 
    HNSCC_INT: "#FFB84D"

  highlight: "#FFD700"  

  heatmap:
    low: "#2166AC"    
    mid: "#F7F7F7"    
    high: "#B2182B"   
  
  plsda:
    positive: "#CD5C5C" 
    negative: "#4682B4" 
    
  distribution:
    mean: "darkred"
    median: "black"

viz:
  heatmap_metadata: ["Group", "Original_Source"]
  merge_case_groups: false
  highlight_pattern: "_LS"

# --- Inference Statistics ---
stats:
  seed: 2025
  min_sample_size: 4
  min_network_n: 3
  min_variance: 0.000001
  n_boot: 1000        
  n_perm: 2000        
  alpha: 0.05         
  pvalue_threshold: 0.05
  network_threshold_type: "absolute"
  network_edge_threshold: 0.075
  min_marginal_cor: 0.10
  n_cores: "auto"

# --- CYTOSCAPE EXPORT FILTERS ---
cytoscape_export:
  baseline:
    min_stability_freq: 0.95 
    min_abs_pcor: 0.10
    max_export_edges: 50 
  
  differential:
    exclude_conserved: false
    min_stability_freq_any: 0.95
    min_diff_score: 0.10
    max_export_edges: 50

# --- TRUSTWORTHY / RESPONSIBLE-AI MODULE (Phase 6) ---
# Spine = specification-curve robustness (P1); supports = conformal abstention
# (P2) + explanation-agreement audit (P3). P4/P5/P6 stay scaffolded behind a
# clinical-metadata gate until survival/batch/demographics are supplied.
trustworthy:
  enabled: true
  quick: true            # true = fast iteration grid; false = full grid (heavier)
  from_raw_axes: false   # reserved hook for re-deriving QC/outlier axes from raw
  tasks: ["00_HDvsTumor", "03_EPvsLS"]   # scenario ids to audit
  multiverse:
    representation: ["z", "raw_med", "raw_z"]
    feature_space:  ["abundance", "with_edges", "edges_only"]
    edge_threshold: [0.0, 0.10]
    estimator:      ["ridge", "enet", "lasso", "rf"]
    n_rep_quick: 6       # CV repeats per spec in quick mode
    n_rep_full: 15       # CV repeats per spec in full mode
    k: 5                 # CV folds
    n_perm: 200          # permutation draws for the headline null
  conformal:
    alpha: 0.10          # target miscoverage -> ~90% coverage
    n_rep: 150
  explanation:
    top_k: 10
    sources: ["enet", "rf_perm", "splsda", "net_degree"]
  # --- DATA-GATED pillars (auto-skip until columns exist in metadata) ---
  survival:
    enabled: true
    models: ["coxnet", "rsf"]
    time_col: null
    event_col: null
  confound:
    enabled: true
    batch_col: null
  fairness:
    enabled: true
    subgroups: ["sex", "age_band", "cancer_type"]
    min_stratum_n: 8

EOF: TRUE
